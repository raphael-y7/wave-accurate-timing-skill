    one_liner: 先定「现在在哪一级、往哪走」，再谈买卖点
    intents:
      - 判断当前浪级与趋势方向
      - 确定该看哪个周期
      - 用突破确立高一级趋势
      - 锚定基础浪与细分浪
    keywords: [浪级, 定级, 趋势方向, 基础浪, 细分浪, 递归, degree, trend direction, timeframe]
