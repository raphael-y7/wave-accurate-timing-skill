entry:
  name: wave-accurate-timing-skill
  description: >-
    陈晓东《精准择时》波浪理论内部结构分析体系的单一入口。先定浪级与方向，再判「具备结构条件/结束信号」，
    用逆势点、转势点、顺势点与多空分界点定位买卖点，按位置设止损、目标与主动/被动出局，并用多周期复核与
    多标注应对处理不确定性。触发：用户问现在是什么级别、该不该买、回调到哪里买、止损放哪、目标多少、
    什么时候走、这个低点能不能抄、多空分界点在哪、板块启动怎么选股、一点三级共振、多标注怎么下单，
    或要求用波浪内部结构分析某只 A 股/指数/期货。不适用：纯基本面估值、消息面博弈、盘口高频、无 K 线数据品种。
  core_principles:
    - 先定级定方向，再谈买卖点：级别判错则止损、目标、仓位全错
    - 「具备结构条件」不等于「结束信号」：前者只能主动出局/减仓，后者才能反向建仓
    - 三类交易点严格区分：逆势点（调整极端分批）、转势点（结束信号确认）、顺势点（趋势确立后回调结束）
    - 止损永远放本浪起点之外，目标放高一级结构条件处，主动/被动出局事先分设
    - 位置决定策略：同一形态在不同位置，目标、止损、仓位全不同
    - 多标注/多演变时不硬选边：等幅度大的结构具备条件、等验证、或降仓
  out_of_scope:
    - 纯基本面估值与财务分析
    - 消息面、资金流、盘口与高频交易
    - 无 K 线数据或流动性极差的品种
    - 保证收益类承诺
  stop_conditions:
    - 多周期数据不足（无法定级）时停止，要求补数据
    - 结构标注存在多解且无法比较幅度时，只观察不参与
    - 关键点位无法确定（浪起点不明）时，不下单

router_entry:
  name: wave-accurate-timing-skill-router
  description: >-
    陈晓东《精准择时》体系入口（择时与买卖点）：定级定方向、结构条件与结束信号、调整形态词典、
    逆势抓底与三类交易点、多空分界点、位置策略、顺势点、止损目标出局、短线买点、板块选股、
    高胜率共振、多周期复核、多标注应对、走势预测。与同作者《精准数浪》技能区分：数浪入口解决
    「浪怎么数、级别怎么标」，本入口解决「数完之后何时买、买多少、何时走」。不适用于纯基本面与消息面。
promotion_budget: 8

