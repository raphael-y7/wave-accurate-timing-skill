        当用户问「现在是什么级别、往哪走、该看哪个周期」，或需要判断周线/月线/年线趋势方向时使用。
        用「次一级三浪上破本级别前高」确立高一级趋势，递归定级；不适用于只有单周期数据、纯基本面判断，
        也不适用于单纯数浪（那属于同作者《精准数浪》技能）。
